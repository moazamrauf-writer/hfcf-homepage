<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Our Team | Holistic Foster Care Foundation</title>
<meta http-equiv="refresh" content="0; url=about.html#team">
<link rel="canonical" href="about.html#team">
<!--hfcf-mobile--><style id="hfcf-mobile">
.hfcf-burger{display:none}
@media (max-width:900px){
header{flex-wrap:wrap!important;padding:14px 20px!important;gap:10px!important;align-items:center!important}
header>a:first-child{font-size:16px!important;gap:10px!important}
header>a:first-child img{height:34px!important}
.hfcf-burger{display:inline-flex;align-items:center;justify-content:center;margin-left:auto;width:46px;height:46px;border-radius:12px;border:2px solid rgba(255,255,255,.55);background:rgba(2,13,25,.35);color:#fff;cursor:pointer;padding:0}
.hfcf-burger svg{pointer-events:none}
header>nav{display:none!important;flex-direction:column;align-items:stretch!important;flex-wrap:nowrap!important;gap:0!important;width:100%;order:3;background:rgba(2,13,25,.96);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:6px 18px 14px;box-sizing:border-box;font-size:17px!important}
header.hfcf-open>nav{display:flex!important}
header>nav a{display:block;padding:14px 2px!important;border-bottom:1px solid rgba(255,255,255,.12)!important}
header>nav a:last-child{margin-top:14px;text-align:center;border:2px solid #00FFC8!important;border-radius:100px;padding:13px 20px!important;color:#fff}
header>div:last-child{display:none!important}
header.hfcf-open>div:last-child{display:block!important;order:4;width:100%}
}
@media (max-width:640px){
html{-webkit-text-size-adjust:100%}
section{padding-left:20px!important;padding-right:20px!important}
section[style*="padding:72px"],section[style*="padding:80px"],section[style*="padding:88px"],section[style*="padding:64px"]{padding-top:52px!important;padding-bottom:52px!important}
[style*="padding:56px 48px 88px"],[style*="padding:48px 48px 88px"],[style*="padding:40px 48px 96px"]{padding:28px 20px 56px!important}
[style*="padding:72px 48px 36px"],[style*="padding:28px 48px"],[style*="padding:24px 48px"]{padding-left:20px!important;padding-right:20px!important}
section[style*="min-height:780px"]{min-height:0!important}
h1{font-size:clamp(32px,9vw,40px)!important;line-height:1.14!important}
h2{font-size:clamp(26px,7.4vw,32px)!important;line-height:1.2!important}
p[style*="font-size:19px"]{font-size:17px!important}
[style*="gap:48px"]{gap:32px!important}
[style*="gap:44px"]{gap:28px!important}
[style*="padding:36px;"]{padding:22px!important}
[style*="padding:30px;"]{padding:22px!important}
/* marquee cards */
[style*="flex:none;width:390px"]{width:290px!important;padding:14px!important;gap:12px!important}
[style*="flex:none;width:380px"]{width:290px!important;padding:20px!important}
[style*="flex:none;width:56px"]{width:44px!important;height:44px!important}
.hfcf-track [style*="width:56px"] svg{width:24px;height:24px}
/* grids */
[style*="minmax(340px"],[style*="minmax(320px"],[style*="minmax(250px"],[style*="minmax(230px"]{grid-template-columns:minmax(0,1fr)!important}
figure[style*="flex:1 1 250px"]{flex:1 1 calc(50% - 8px)!important;min-width:0!important}
figure[style*="flex:1 1 250px"] figcaption,figure[style*="flex:1 1 250px"] span,figure[style*="flex:1 1 250px"] p{font-size:14px!important}
/* donation + calculator forms */
#g-funds{grid-template-columns:minmax(0,1fr)!important}
#g-presets button{font-size:16px!important;padding:14px 4px!important}
form#give-form{padding:22px!important;max-width:100%!important}
[id^="zc-"] input{font-size:17px}
table th,table td{padding-left:6px!important;padding-right:6px!important}
/* floating give button */
a[aria-label="Give now"]{right:14px!important;bottom:14px!important;padding:11px 18px!important;font-size:15px!important;transition:opacity .25s ease,transform .25s ease!important}
.hfcf-fab-hide a[aria-label="Give now"]{opacity:0!important;pointer-events:none!important;transform:translateY(12px)!important}
/* footer */
footer{padding-left:20px!important;padding-right:20px!important}
}
@media (max-width:380px){
[style*="flex:none;width:390px"],[style*="flex:none;width:380px"]{width:260px!important}
#g-presets{display:contents}
}
</style>
</head>
<body>
<p>Our team now lives on the <a href="about.html#team">About Us page</a>.</p>
<script>location.replace("about.html#team");</script>
<!--hfcf-mobile--><script>
(function(){
function init(){
var hs=document.querySelectorAll('header');
hs.forEach(function(h,i){
var nav=h.querySelector(':scope>nav');if(!nav||h.querySelector('.hfcf-burger'))return;
var b=document.createElement('button');b.type='button';b.className='hfcf-burger';b.setAttribute('aria-label','Open menu');b.setAttribute('aria-expanded','false');
nav.id=nav.id||('hfcf-nav'+i);b.setAttribute('aria-controls',nav.id);
var open='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>';
var close='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>';
b.innerHTML=open;
function set(on){h.classList.toggle('hfcf-open',on);b.setAttribute('aria-expanded',on);b.setAttribute('aria-label',on?'Close menu':'Open menu');b.innerHTML=on?close:open;}
b.addEventListener('click',function(){set(!h.classList.contains('hfcf-open'));});
nav.addEventListener('click',function(e){if(e.target.closest('a'))set(false);});
document.addEventListener('keydown',function(e){if(e.key==='Escape')set(false);});
h.insertBefore(b,nav);
});
var mq=window.matchMedia('(max-width:640px)');
function fab(){document.documentElement.classList.toggle('hfcf-fab-hide',mq.matches&&window.scrollY<500);}
window.addEventListener('scroll',fab,{passive:true});mq.addEventListener&&mq.addEventListener('change',fab);fab();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
